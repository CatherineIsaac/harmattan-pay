{% extends "base.html" %}
{% block title %}Log in - Harmattan Pay{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">
  <label>Username</label>
  <input name="username">
  <label>Password</label>
  <input name="password" type="password">
  <button type="submit">Log in</button>
</form>
{% endblock %}
